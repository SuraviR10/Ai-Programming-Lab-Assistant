<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milestones & Badges — AI Lab Assistant</title>
  <meta name="description" content="View earned lab milestones and recognition in the AI C Programming Laboratory." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />

  <style>
    .main-content {
      margin-left: 260px;
      min-height: 100vh;
      padding: 32px;
      position: relative;
      z-index: 2;
    }

    .trophy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .trophy-card {
      background: rgba(13, 21, 46, 0.75);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      gap: 18px;
      backdrop-filter: blur(16px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .trophy-card:not(.locked):hover {
      border-color: var(--neon-cyan);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 242, 254, 0.15);
    }

    .trophy-card.locked {
      opacity: 0.35;
      border-style: dashed;
    }

    .trophy-icon-box {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.25);
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
    }

    @media (max-width: 768px) {
      .main-content { margin-left: 0; padding: 20px; }
    }
  </style>
</head>
<body>

  <div class="main-content" id="page-content">
    <div class="page-header anim-init anim-fade-up">
      <div>
        <div class="label" style="color: var(--neon-cyan); margin-bottom: 4px;">STUDENT ACHIEVEMENTS</div>
        <h1 style="font-size: var(--text-3xl); font-weight: 900;">Lab Milestones & Badges</h1>
        <p style="font-size: var(--text-sm); color: var(--text-faint);">Earn recognition and bonus points by completing laboratory programs and challenges.</p>
      </div>
      <div style="display: flex; gap: 16px; font-family: var(--font-mono); font-size: var(--text-xs);">
        <div><strong style="color: var(--xp-gold); font-size: 16px;">6 / 7</strong> <span style="color: var(--text-ghost);">COMPLETED</span></div>
      </div>
    </div>

    <!-- Trophies Grid -->
    <div class="trophy-grid" id="trophies-container"></div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script src="../js/mock-data.js"></script>
  <script src="../js/security.js"></script>
  <script src="../js/audio.js"></script>
  <script src="../js/gamification.js"></script>
  <script src="../js/cursor.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/app.js"></script>

  <script>
    App.init({
      role: 'student',
      activeNav: 'achievements',
      onReady: () => {
        const container = document.getElementById('trophies-container');
        MockData.achievements.forEach((ach, i) => {
          const card = document.createElement('div');
          card.className = `trophy-card tilt-card ${ach.earned ? '' : 'locked'}`;
          card.setAttribute('data-reveal', '');
          card.style.animationDelay = `${i * 0.05}s`;

          card.innerHTML = `
            <div class="trophy-icon-box">${ach.icon}</div>
            <div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px;">
                <h4 style="font-family: var(--font-display); font-size: 15px; font-weight: 800; color: #fff;">${ach.title}</h4>
                <span class="mission-xp-badge" style="background: rgba(99, 102, 241, 0.2); color: #a5b4fc; padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 12px;">+${ach.xp} Points</span>
              </div>
              <p style="font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 8px;">${ach.description}</p>
              <div style="font-size: 10px; font-family: var(--font-mono); color: ${ach.earned ? 'var(--neon-emerald)' : 'var(--text-ghost)'};">
                ${ach.earned ? `✓ COMPLETED ${App.formatDate(ach.earnedDate)}` : '🔒 LOCKED'}
              </div>
            </div>
          `;
          container.appendChild(card);
        });

        Animations.initTiltCards();
        Animations.initScrollReveal();
      }
    });
  </script>
</body>
</html>
